name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag matches csproj version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CSPROJ_VERSION=$(grep -m1 -oE '<Version>[^<]+</Version>' src/Tesearis.SmolVDecoder/Tesearis.SmolVDecoder.csproj | sed -E 's/<Version>(.*)<\/Version>/\1/')
          echo "Tag version:    $TAG_VERSION"
          echo "csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match <Version>$CSPROJ_VERSION</Version> in Tesearis.SmolVDecoder.csproj"
            exit 1
          fi

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore Tesearis.SmolVDecoder.slnx

      - name: Build (Release)
        run: dotnet build Tesearis.SmolVDecoder.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Tesearis.SmolVDecoder.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Tesearis.SmolVDecoder/Tesearis.SmolVDecoder.csproj -c Release -o artifacts

      - name: Package raw binaries
        run: |
          VERSION="${RELEASE_TAG#v}"
          STAGE="artifacts/binaries-stage"
          mkdir -p "$STAGE/netstandard2.0" "$STAGE/net8.0"
          cp src/Tesearis.SmolVDecoder/bin/Release/netstandard2.0/Tesearis.SmolVDecoder.dll src/Tesearis.SmolVDecoder/bin/Release/netstandard2.0/Tesearis.SmolVDecoder.pdb "$STAGE/netstandard2.0/"
          cp src/Tesearis.SmolVDecoder/bin/Release/net8.0/Tesearis.SmolVDecoder.dll src/Tesearis.SmolVDecoder/bin/Release/net8.0/Tesearis.SmolVDecoder.pdb "$STAGE/net8.0/"
          cp LICENSE README.md ThirdPartyNotices.md "$STAGE/"
          (cd "$STAGE" && zip -r "../Tesearis.SmolVDecoder-v${VERSION}-binaries.zip" .)

      - name: Extract changelog section
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > artifacts/RELEASE_NOTES.md
          if [ ! -s artifacts/RELEASE_NOTES.md ]; then
            echo "::error::No changelog entry found for ${RELEASE_TAG} (expected a '## [${VERSION}]' heading in CHANGELOG.md)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            artifacts/*.nupkg artifacts/*.snupkg artifacts/*.zip \
            --title "${RELEASE_TAG}" \
            --notes-file artifacts/RELEASE_NOTES.md \
            --verify-tag

      - name: Upload NuGet package for publish job
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v7
        with:
          name: nuget-package
          path: artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
